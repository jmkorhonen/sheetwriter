name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests (headless Chromium)
        run: npm test
      - name: Browser tests (headless Firefox)
        run: node tests/run.js --browser=firefox
      - name: Browser tests (headless WebKit)
        run: node tests/run.js --browser=webkit
      - name: Built file in docs/ matches the sources
        run: |
          python3 build.py
          git diff --exit-code --stat -- docs/
